    power_kw: 50
    required_energy_kwh: 100
    preferred_start_step: 16 # 04:00 AM (runs off-peak night)

common_area:
  base_kw: 80
  peak_kw: 160

policy:
  balanced:
    cost: 0.25
    carbon: 0.25
    peak: 0.25
    discomfort: 0.20
